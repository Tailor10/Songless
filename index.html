<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hallod?</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- NÉV MEGADÁSA -->

    <div id="nameModal" class="modal">

        <div class="modal-box">

            <h2>🎵 Üdv a Hallod?-ban!</h2>

            <p>
                Add meg a neved, ami a ranglistán meg fog jelenni.
            </p>

            <input
                id="playerNameInput"
                type="text"
                maxlength="20"
                placeholder="Például: Ádám"
                autocomplete="off">

            <button id="startGameButton">
                Játék indítása ▶
            </button>

        </div>

    </div>


    <!-- FŐ JÁTÉK -->

    <main class="game">

        <header>

            <h1>🎵 Hallod?</h1>

            <p>
                Találd ki a magyar dalt minél kevesebb hallgatásból!
            </p>

        </header>


        <!-- STATISZTIKÁK -->

        <section class="stats">

            <div class="stat">

                <span>Pontszám</span>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>Streak</span>

                <strong id="streak">
                    0 🔥
                </strong>

            </div>


            <div class="stat">

                <span>Kör</span>

                <strong id="round">
                    1
                </strong>

            </div>

        </section>


        <!-- LEADERBOARD -->

        <section class="leaderboard">

            <div class="leaderboard-header">

                <h2>🏆 Ranglista</h2>

                <button
                    id="changeNameButton"
                    type="button">

                    Név módosítása

                </button>

            </div>


            <div
                id="leaderboardList"
                class="leaderboard-list">

                <div class="leaderboard-loading">
                    Ranglista betöltése...
                </div>

            </div>

        </section>


        <!-- LEJÁTSZÓ -->

        <section class="player">

            <button
                id="playButton"
                class="play-button"
                disabled>

                ▶

            </button>


            <div class="time-display">

                <span id="currentTime">
                    0.0
                </span>

                <span class="time-separator">
                    /
                </span>

                <span id="listenTime">
                    0.5
                </span>

                <span class="time-unit">
                    mp
                </span>

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">

                </div>

            </div>

        </section>


        <!-- KERESŐ -->

        <section class="search-container">

            <input
                id="guessInput"
                type="text"
                placeholder="Írd be a dal vagy előadó nevét..."
                autocomplete="off">

            <div
                id="results"
                class="results">

            </div>

        </section>


        <!-- GOMBOK -->

        <section class="buttons">

            <button
                id="giveUpButton"
                class="secondary danger">

                Feladom

            </button>


            <button
                id="moreButton"
                class="secondary">

                Többet hallgatok

            </button>

        </section>


        <!-- ÜZENET -->

        <div
            id="message"
            class="message">

            Add meg a neved a játék indításához!

        </div>


        <!-- KÖVETKEZŐ DAL -->

        <button
            id="nextButton"
            class="next-button hidden">

            Következő dal →

        </button>

    </main>


    <!-- FONTOS: type="module" -->

    <script
        type="module"
        src="app.js">

    </script>

</body>

</html>
